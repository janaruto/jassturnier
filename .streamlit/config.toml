[theme]
base = "dark"
primaryColor = "#e3b341"
backgroundColor = "#174a30"
secondaryBackgroundColor = "#0f3622"
textColor = "#f6efdc"
borderColor = "#2e6a48"
linkColor = "#f5d77f"
baseRadius = "10px"
font = "Alegreya Sans:https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;500;700;800&display=swap"
headingFont = "Alegreya SC:https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700&display=swap"
redColor = "#f08a7f"
greenColor = "#9fe3b4"
yellowColor = "#f5d77f"

[client]
toolbarMode = "minimal"

[server]
maxUploadSize = 25

[browser]
gatherUsageStats = false
